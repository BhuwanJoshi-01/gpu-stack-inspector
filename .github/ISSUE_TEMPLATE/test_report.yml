name: Test report
description: Tell us how it did on your machine (it helps a lot, even when everything works)
labels: ["needs: hardware-test"]
body:
  - type: markdown
    attributes:
      value: Don't paste user names, home paths or tokens. The redacted report is enough.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 26.04, Fedora 44, Arch, Windows 11 + WSL2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: e.g. RTX 3050 Laptop, driver 595.99 (or "no NVIDIA GPU")
    validations:
      required: true
  - type: textarea
    id: envs
    attributes:
      label: Environments you compared
      description: Manager (venv, conda, uv, pyenv…), Python version and PyTorch version of each, and which ones really use the GPU.
      placeholder: |
        A: conda, Python 3.12, torch 2.11.0+cu128, uses the GPU
        B: venv, Python 3.11, torch 2.11.0+cpu, CPU only
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What gave the right answer?
      options:
        - label: inspect
        - label: compare
        - label: probe --runtime
        - label: report (redacted, safe to share)
  - type: textarea
    id: notes
    attributes:
      label: What was wrong, missing or confusing?
