name: Feature request
description: Suggest a check, an output format or a new kind of environment
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: Describe the situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you work around it today?
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this come up?
      options:
        - Once
        - Now and then
        - Every week or more
  - type: textarea
    id: interface
    attributes:
      label: What would you like the tool to do?
      description: The command you would run and the output you would expect.
      render: text
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we know it works?
      description: A situation (ideally one you can reproduce) where the new behaviour gives the right answer.
  - type: textarea
    id: alternatives
    attributes:
      label: Scope and alternatives
      description: Other tools that do this, and anything this should deliberately not do.
