name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Platform-neutral parts only; GPU and driver checks are not claimed for Windows.
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  probe-compat:
    # The tool needs Python 3.11+, but the metadata probe runs inside the user's
    # interpreters, which can be much older or not CPython at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Install target interpreters
        run: uv python install 3.8 3.9 3.10 pypy3.10
      - name: Run the probe in each of them
        run: |
          pythons=""
          for version in 3.8 3.9 3.10 pypy3.10; do
            pythons="$pythons:$(uv python find --no-project "$version")"
          done
          GSI_TEST_PYTHONS="${pythons#:}" uv run pytest -q -rA tests/integration/test_probe_versions.py

  package:
    # The wheel a user installs must work on its own: build it, install it into an empty
    # environment (no repository, no dev tools) and run the installed command.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the sdist and wheel
        run: uv build
      - name: The wheel carries the probe programs and the compatibility data
        run: |
          wheel=$(ls dist/*.whl)
          for file in probes/metadata_program.py probes/runtime_program.py compatibility/data.json; do
            python -m zipfile -l "$wheel" | grep -q "gpu_stack_inspector/$file" || { echo "::error::$file missing from $wheel"; exit 1; }
          done
      - name: Install the wheel into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/fresh" --python 3.12
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl
      - name: Run the installed command
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/fresh/Scripts"; else bin="$RUNNER_TEMP/fresh/bin"; fi
          "$bin/gpu-stack-inspector" --version
          "$bin/gpu-stack-inspector" --help > /dev/null
          "$bin/gpu-stack-inspector" rules list > /dev/null
          "$bin/gpu-stack-inspector" inspect --python "$bin/python" --format json > report.json
          "$bin/python" -c "import json; d = json.load(open('report.json')); assert d['schema_version'] == 1 and d['interpreters'][0]['version']"

  audit:
    # Known vulnerabilities in the runtime dependencies (not the dev tools).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit --strict --requirement requirements.txt

  dependency-review:
    # Flags vulnerable or license-incompatible dependencies a pull request adds.
    # GitHub offers it on public repositories; skipped while this one is private.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
