name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Platform-neutral parts only; GPU and driver checks are not claimed for Windows.
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  probe-compat:
    # The tool needs Python 3.11+, but the metadata probe runs inside the user's
    # interpreters, which can be much older or not CPython at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Install target interpreters
        run: uv python install 3.8 3.9 3.10 pypy3.10
      - name: Run the probe in each of them
        run: |
          pythons=""
          for version in 3.8 3.9 3.10 pypy3.10; do
            pythons="$pythons:$(uv python find --no-project "$version")"
          done
          GSI_TEST_PYTHONS="${pythons#:}" uv run pytest -q -rA tests/integration/test_probe_versions.py
